    <!-- Bottom Nav Bar (Suppressed as per "Task-Focused" rule but technically part of shell if needed - Here we follow suppression for focus) -->
    <script>
        function handleComplete() {
            // Minimalist feedback for button interaction
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Đang xử lý...';
            btn.classList.add('opacity-80');

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">verified</span> Thanh toán thành công!';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-success');

                // Trigger confetti or similar effect if desired
                console.log("Transaction verified successfully.");
            }, 1500);
        }

        // Add a micro-interaction to the QR code
        document.querySelector('.group').addEventListener('mousemove', (e) => {
            const el = e.currentTarget;
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;

            el.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.querySelector('.group').addEventListener('mouseleave', (e) => {
            e.currentTarget.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            e.currentTarget.style.transition = 'transform 0.5s ease';
        });
    </script>
